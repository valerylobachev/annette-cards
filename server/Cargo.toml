[package]
name = "annette-cards"
version = "0.1.0"
edition = "2024"
description = "Annette Cards server: API, sync and the embedded PWA"
publish = false
repository = "https://github.com/valerylobachev/annette-cards"

[dependencies]
anyhow = "1.0.104"
argon2 = "0.6.0"
async-trait = "0.1"
axum = "0.8.9"
axum-extra = { version = "0.12.6", features = ["cookie"] }
base64 = "0.23.1"
chrono = { version = "0.4.45", default-features = false, features = ["std"] }
chrono-tz = "0.10.4"
clap = { version = "4.6.7", features = ["derive"] }
cookie = "0.18"
figment = { version = "0.10.19", features = ["env", "toml"] }
fsrs = "=6.6.2"
mime_guess = "2.0.5"
rand = "0.10.3"
reqwest = { version = "0.13", default-features = false, features = ["json", "query", "rustls"] }
rpassword = "7.5.4"
rust-embed = "8.12.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "sqlite", "macros", "migrate"] }
thiserror = "2.0.20"
tokio = { version = "1.53.1", features = ["full"] }
tower-http = { version = "0.7.1", features = ["trace", "compression-gzip", "compression-zstd", "timeout", "cors", "request-id", "set-header", "util"] }
tower_governor = { version = "0.8.0", default-features = false, features = ["axum"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "json"] }
utoipa = { version = "5.5.0", features = ["axum_extras"] }
utoipa-axum = "0.2.0"
uuid = { version = "1.26.1", features = ["v7"] }
web-push-native = { version = "0.5.0", default-features = false, features = ["vapid"] }

[dev-dependencies]
http-body-util = "0.1.5"
tower = { version = "0.5.3", features = ["util"] }
