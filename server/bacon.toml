# bacon configuration: https://dystroy.org/bacon/config/
# `just dev-server` runs `bacon serve` (interactive); `just dev` runs `bacon --headless`, which uses the default job.

default_job = "serve"

[jobs.serve]
command = ["cargo", "run", "--", "serve"]
need_stdout = true
allow_warnings = true
background = false
on_change_strategy = "kill_then_restart"
watch = ["migrations"]
